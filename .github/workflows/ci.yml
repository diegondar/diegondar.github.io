name: CI Pipeline

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Send notification email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.gitmail }}
          password: ${{ secrets.gitpass }}
          subject: "PR Test Results - Success"
          to: die.e.gondar@gmail.com
          from: "GitHub Actions <no-reply@github.com>"
          body: |
            CI pipeline finished successfully.
            All tests passed ✅
